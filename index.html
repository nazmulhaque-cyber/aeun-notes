    <!-- Apply saved theme and language before the first paint (prevents a white flash in dark mode). -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem('aeun_notes_theme_v1');
          var dark =
            theme === 'dark' ||
            (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            root.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0F1115');
          }
          var lang = localStorage.getItem('aeun_notes_language_v1');
          if (lang === 'bn' || lang === 'en') root.lang = lang;
        } catch (e) {}
      })();
    </script>
