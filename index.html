<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D6FF2">
<title>AEUN Notes</title>
<meta name="description" content="A calm, offline-first notes and checklist app in English and Bangla.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F6F7F6;--card:#FFFFFF;--head:#FFFFFF;--sheet:#FFFFFF;--text:#191B1E;--muted:#6B7280;
  --border:#E3E6E3;--accent:#1D6FF2;--accent-soft:#E5F6EC;--danger:#DC2626;
  --shadow:0 10px 30px rgba(15,17,21,.18);
  --c-yellow:#FFF3C4;--c-mint:#D8F3E2;--c-sky:#D9EBFF;--c-rose:#FFE1E8;--c-lav:#E8E2FF;
}
html[data-theme="dark"]{
  --bg:#101214;--card:#1B1E22;--head:#15171A;--sheet:#1E2126;--text:#ECEEF0;--muted:#9BA1A8;
  --border:#2C3036;--accent:#5B93FF;--accent-soft:#14301F;
  --shadow:0 10px 30px rgba(0,0,0,.55);
  --c-yellow:#3A3421;--c-mint:#1E3329;--c-sky:#1E2E40;--c-rose:#3B252C;--c-lav:#2B2742;
}
html{-webkit-text-size-adjust:100%}
body{font-family:"Hind Siliguri",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Bengali",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
svg{flex:0 0 auto}
.topwrap{position:sticky;top:0;z-index:30;background:var(--head);border-bottom:1px solid var(--border)}
.topbar{padding:calc(8px + env(safe-area-inset-top)) 12px 8px;max-width:860px;margin:0 auto}
.trow{display:flex;align-items:center;gap:4px}
.logo{width:30px;height:30px;border-radius:8px}
.appname{font-size:19px;font-weight:700;margin-right:auto;letter-spacing:.2px;padding-left:6px}
.icobtn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.icobtn:active{background:var(--accent-soft)}
.langbtn{width:auto;min-width:44px;padding:0 10px;border-radius:19px;font-weight:700;font-size:13px;color:var(--accent);border:1.5px solid var(--accent)}
.searchrow{margin-top:8px}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:24px;padding:0 14px;height:42px;color:var(--muted)}
.searchbox input{flex:1;border:0;background:none;outline:none;font-size:15px;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none;max-width:860px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:18px;border:1px solid var(--border);background:var(--card);font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .cnt{opacity:.75;font-weight:500;font-size:12px;margin-left:3px}
main{padding:12px 12px 120px;max-width:860px;margin:0 auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
main.list .grid{grid-template-columns:1fr}
@media(min-width:680px){.grid{grid-template-columns:repeat(3,1fr)}main.list .grid{grid-template-columns:1fr}}
.sect{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:8px 2px 0}
.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;overflow:hidden;cursor:pointer;transition:transform .08s ease}
.card:active{transform:scale(.98)}
.card.c-yellow{background:var(--c-yellow)}.card.c-mint{background:var(--c-mint)}.card.c-sky{background:var(--c-sky)}.card.c-rose{background:var(--c-rose)}.card.c-lavender{background:var(--c-lav)}
.card h3{font-size:15.5px;font-weight:700;line-height:1.35;margin-bottom:4px;padding-right:24px;word-break:break-word}
.card .body{font-size:14px;line-height:1.55;color:var(--muted);white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.pinmark{position:absolute;top:9px;right:36px;color:var(--accent);display:flex}
.dots{position:absolute;top:3px;right:3px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.chk{display:flex;flex-direction:column}
.chkrow{display:flex;align-items:flex-start;gap:8px;padding:3.5px 0;font-size:14px;line-height:1.4;word-break:break-word}
.box{flex:0 0 auto;width:20px;height:20px;border:2px solid var(--muted);border-radius:6px;margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff}
.box.done{background:var(--accent);border-color:var(--accent)}
.chkrow.done>span:last-child{text-decoration:line-through;color:var(--muted)}
.more{font-size:12.5px;color:var(--muted);margin-top:4px}
.tagsrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tag{font-size:11px;background:rgba(127,127,127,.15);padding:2px 8px;border-radius:10px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:52px 24px;font-size:15.5px;line-height:1.65}
.empty .ring{width:84px;height:84px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(22,163,74,.4);z-index:40;transition:transform .1s ease}
.fab:active{transform:scale(.93)}
.backdrop{position:fixed;inset:0;background:rgba(10,10,12,.45);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:50}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-radius:22px 22px 0 0;padding:8px 12px calc(14px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease;z-index:51;max-width:560px;margin:0 auto;box-shadow:var(--shadow)}
.sheet.show{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--border);margin:2px auto 8px}
.sheet h4{font-size:13px;color:var(--muted);text-align:center;margin-bottom:8px;font-weight:600}
.sheetbtn{display:flex;align-items:center;gap:14px;width:100%;padding:13px 10px;font-size:16px;font-weight:600;border-radius:12px;text-align:left;color:var(--text)}
.sheetbtn:active{background:var(--accent-soft)}
.sheetbtn.danger{color:var(--danger)}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:60;transform:translateY(100%);transition:transform .24s ease;display:flex;flex-direction:column;visibility:hidden}
.overlay.show{transform:none;visibility:visible}
.overlay.cbg-yellow{background:var(--c-yellow)}.overlay.cbg-mint{background:var(--c-mint)}.overlay.cbg-sky{background:var(--c-sky)}.overlay.cbg-rose{background:var(--c-rose)}.overlay.cbg-lavender{background:var(--c-lav)}
.ed-top{display:flex;align-items:center;gap:4px;padding:calc(8px + env(safe-area-inset-top)) 8px 4px}
.ed-top .sp{flex:1}
.ed-pin.on{color:var(--accent);background:var(--accent-soft)}
.ed-scroll{flex:1;overflow-y:auto;padding:4px 18px 14px}
#edTitle{width:100%;border:0;background:none;outline:none;font-size:21px;font-weight:700;padding:8px 0 4px}
#edBody{width:100%;border:0;background:none;outline:none;resize:none;font-size:16px;line-height:1.65;min-height:42vh;padding:4px 0}
.edrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}
.edrow .box{cursor:pointer;width:22px;height:22px}
.edrow input{flex:1;border:0;background:none;outline:none;font-size:16px;min-width:0;padding:3px 0}
.edrow input.done-t{text-decoration:line-through;color:var(--muted)}
.rowx{width:32px;height:32px;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:0 0 auto;border-radius:50%}
.addrow{display:flex;align-items:center;gap:10px;padding:12px 0;color:var(--accent);font-weight:600;font-size:15px;width:100%;text-align:left}
.ed-foot{border-top:1px solid var(--border);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--head)}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);padding:0}
.dot.sel{border-color:var(--accent);transform:scale(1.14)}
.dot[data-color="default"]{background:var(--card)}.dot[data-color="yellow"]{background:var(--c-yellow)}.dot[data-color="mint"]{background:var(--c-mint)}.dot[data-color="sky"]{background:var(--c-sky)}.dot[data-color="rose"]{background:var(--c-rose)}.dot[data-color="lavender"]{background:var(--c-lav)}
.chkToggle{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted);margin-left:auto;cursor:pointer}
.chkToggle input{width:18px;height:18px;accent-color:var(--accent)}
.snack{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,90px);background:#22252A;color:#F3F4F6;padding:11px 16px;border-radius:12px;display:flex;align-items:center;gap:16px;font-size:14.5px;z-index:70;transition:transform .22s ease;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.snack.show{transform:translate(-50%,0)}
.snack button{color:#4ADE80;font-weight:700;font-size:14.5px;padding:2px 4px}
</style>
<style>
@font-face{ font-family:'Bornomala'; src:url('https://nazmulhaque-cyber.github.io/aeun-tools/fonts/Bornomala-Regular.ttf') format('truetype'); font-weight:400; font-display:swap; unicode-range:U+0980-09FF,U+200C-200D; }
@font-face{ font-family:'Bornomala'; src:url('https://nazmulhaque-cyber.github.io/aeun-tools/fonts/Bornomala-Bold.ttf') format('truetype'); font-weight:700; font-display:swap; unicode-range:U+0980-09FF,U+200C-200D; }
body{ font-family:'Bornomala',"Hind Siliguri",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Bengali",Arial,sans-serif !important; }
.aeun-bar{position:relative;z-index:60;background:#081627;color:#C7D6EA;font-family:'Bornomala',sans-serif;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;font-size:.86rem}
.aeun-bar a{color:#fff;text-decoration:none;font-weight:700;min-height:32px;display:inline-flex;align-items:center}
.aeun-bar .aeun-brand{letter-spacing:.22em;font-weight:700;color:#9CC2FF;font-size:.78rem}
</style>

<button class="fab" id="fab" aria-label="New note"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="backdrop" id="backdrop"></div>

<div class="sheet" id="chooser">

</div>

<div class="sheet" id="menuSheet">

  <div id="menuBtns"></div>
</div>

<div class="overlay" id="editor">

    <button class="icobtn" id="edBack" aria-label="Back"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg></button>
    <div class="sp"></div>
    <button class="icobtn ed-pin" id="edPin" aria-label="Pin"></button>
  </div>
  <div class="ed-scroll">
    <input id="edTitle" autocomplete="off">
    <div id="edBodyWrap"><textarea id="edBody"></textarea></div>
    <div id="edListWrap" style="display:none">
      <div id="edRows"></div>
      <button class="addrow" id="edAddRow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="edAddRowTxt"></span></button>
    </div>

  </div>
</div>

/* IndexedDB backup mirror: aeun_notes_db v1 / notes_snapshot / 'primary_notes' */
var dbPromise=null;
function openDb(){
  if(dbPromise)return dbPromise;
  dbPromise=new Promise(function(res){
    try{
      var r=indexedDB.open('aeun_notes_db',1);
      r.onupgradeneeded=function(){var db=r.result; if(!db.objectStoreNames.contains('notes_snapshot'))db.createObjectStore('notes_snapshot');};
      r.onsuccess=function(){res(r.result)};
      r.onerror=function(){res(null)};
    }catch(e){res(null)}
  });
  return dbPromise;
}
function idbSave(arr){
  openDb().then(function(db){
    if(!db)return;
    try{db.transaction('notes_snapshot','readwrite').objectStore('notes_snapshot').put(JSON.parse(JSON.stringify(arr)),'primary_notes')}catch(e){}
  });
}
function idbLoad(){
  return openDb().then(function(db){
    if(!db)return null;
    return new Promise(function(res){
      try{
        var rq=db.transaction('notes_snapshot','readonly').objectStore('notes_snapshot').get('primary_notes');
        rq.onsuccess=function(){res(Array.isArray(rq.result)?rq.result:null)};
        rq.onerror=function(){res(null)};
      }catch(e){res(null)}
    });
  });
}

function orderedItems(n){
  if(!n.moveCheckedToBottom)return n.items.slice();
  var u=[],c=[],i;
  for(i=0;i<n.items.length;i++)(n.items[i].checked?c:u).push(n.items[i]);
  return u.concat(c);

function cmpNotes(a,b){
  if(a.isPinned!==b.isPinned)return a.isPinned?-1:1;
  switch(sortOpt){
    case 'created_time':return b.createdAt<b.createdAt?-1:(b.createdAt>a.createdAt?1:0);
    case 'alphabetical':return a.title.localeCompare(b.title);
    case 'color':return a.color<b.color?-1:(a.color>b.color?1:(b.updatedAt<a.updatedAt?-1:1));
    case 'reminder':var ra=a.reminderAt||'9999',rb=b.reminderAt||'9999'; return ra<rb?-1:(ra>rb?1:0);
    case 'recently_opened':return b.lastOpenedAt<a.lastOpenedAt?-1:(b.lastOpenedAt>a.lastOpenedAt?1:0);
    default:return b.updatedAt<a.updatedAt?-1:(b.updatedAt>a.updatedAt?1:0);
  }
}
function visibleNotes(){
  var arr=notes.filter(function(n){
    if(filter==='archive')return n.isArchived&&!n.isTrashed;
    if(filter==='trash')return n.isTrashed;
    if(n.isArchived||n.isTrashed)return false;
    if(filter==='note')return n.mode==='note';
    if(filter==='checklist')return n.mode==='checklist';
    return true;
  });
  if(query){
    var q=query.toLowerCase();
    arr=arr.filter(function(n){
      var hay=n.title+' '+n.body+' '+n.items.map(function(i){return i.text}).join(' ')+' '+n.tags.join(' ');

function menuAction(id,act){

$('#edRows').addEventListener('click',function(e){
  var actEl=e.target.closest('[data-rowact]'); if(!actEl||!ed)return;
  var row=e.target.closest('[data-row]'); if(!row)return;
  var id=row.getAttribute('data-row'), act=actEl.getAttribute('data-rowact'), i, it=null;
  for(i=0;i<ed.items.length;i++)if(ed.items[i].id===id)it=ed.items[i];
  if(!it)return;
  if(act==='toggle'){it.checked=!it.checked; edChanged(); renderEdRows()}
  else if(act==='del'){ed.items=ed.items.filter(function(x){return x.id!==id}); edChanged(); renderEdRows()}
});
$('#edRows').addEventListener('input',function(e){
  if(!e.target.hasAttribute('data-rowtext')||!ed)return;
  var row=e.target.closest('[data-row]'); if(!row)return;
  var id=row.getAttribute('data-row');
  for(var i=0;i<ed.items.length;i++)if(ed.items[i].id===id){ed.items[i].text=e.target.value; break}
  edChanged();
});
$('#edRows').addEventListener('keydown',function(e){
  if(e.key!=='Enter'||!e.target.hasAttribute('data-rowtext')||!ed)return;
  e.preventDefault();
  var row=e.target.closest('[data-row]'); if(!row)return;
  var id=row.getAttribute('data-row'), ix=-1, i;
  for(i=0;i<ed.items.length;i++)if(ed.items[i].id===id)ix=i;
  var ni={id:uid('it'),text:'',checked:false};
  if(ix>=0)ed.items.splice(ix+1,0,ni); else ed.items.push(ni);
  edChanged(); renderEdRows();
  var inputs=$('#edRows').querySelectorAll('[data-rowtext]');
  var target=$('#edRows').querySelector('[data-row="'+ni.id+'"] [data-rowtext]');
  if(target)target.focus();
});
$('#edAddRow').addEventListener('click',function(){
  if(!ed)return;
  var ni={id:uid('it'),text:'',checked:false};
  ed.items.push(ni);
  edChanged(); renderEdRows();
  var target=$('#edRows').querySelector('[data-row="'+ni.id+'"] [data-rowtext]');
  if(target)target.focus();
});
/* ================= header controls ================= */
function applyTheme(){
  document.documentElement.setAttribute('data-theme',theme);
  $('#themeBtn').innerHTML=theme==='dark'?I.sun:I.moon;
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',theme==='dark'?'#101214':'#1D6FF2');
}
function applyLayout(){
  $('#mainEl').classList.toggle('list',layout==='list');
  $('#layoutBtn').innerHTML=layout==='grid'?I.grid:I.list;
}
function applyLang(){
  document.documentElement.setAttribute('lang',lang==='bn'?'bn':'en');
  $('#langBtn').textContent=lang==='bn'?'EN':'বাং';
  $('#searchInput').placeholder=t().searchPh;
  $('#chooserTitle').textContent=t().create;
  $('#chooseNoteTxt').textContent=t().newNote;
  $('#chooseListTxt').textContent=t().newChecklist;
  $('#snackUndo').textContent=t().undo;
}
$('#themeBtn').addEventListener('click',function(){theme=theme==='dark'?'light':'dark'; setSetting(K_THEME,theme); applyTheme()});
$('#layoutBtn').addEventListener('click',function(){layout=layout==='grid'?'list':'grid'; setSetting(K_LAYOUT,layout); applyLayout()});
$('#langBtn').addEventListener('click',function(){lang=lang==='bn'?'en':'bn'; setSetting(K_LANG,lang); applyLang(); render()});
/* Ctrl+Z undo (not while typing in a field) */
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&(e.key==='z'||e.key==='Z')){
    var tg=e.target, tag=tg&&tg.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'||(tg&&tg.isContentEditable))return;
    if($('#editor').classList.contains('show'))return;
    e.preventDefault(); doUndo();
  }
  if(e.key==='Escape'){
    if($('#editor').classList.contains('show'))closeEditor();
    else hideSheets();
  }
});
/* install prompt */
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault(); deferredPrompt=e; $('#installBtn').style.display='flex'});
$('#installBtn').addEventListener('click',function(){
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(){$('#installBtn').style.display='none'; deferredPrompt=null});
});
/* ================= init ================= */
applyTheme(); applyLayout(); applyLang();
(function init(){
  var stored=readStoredNotes();
  if(stored!==null){
    notes=stored; render();
  }else{
    idbLoad().then(function(snap){
      if(snap&&snap.length){notes=normalizeNotes(snap); persist()}
      else{notes=createStarterNotes(lang); persist()}
      render();
    });
  }
})();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
